name: Build and Release

on:
  schedule:
    - cron: '0 0 * * *'     # Cada 24 horas (medianoche UTC)
  workflow_dispatch:         # Permite lanzarlo manualmente

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest

    steps:
      - name: Install dependencies
        run: |
          xbps-install -Suy xbps jq curl unzip coreutils bash
          xbps-install -y openssl

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build package
        run: |
          chmod +x build.sh
          export XBPS_CREATE=/usr/bin/xbps-create
          export XBPS_RINDEX=/usr/bin/xbps-rindex
          rm -f current
          ./build.sh

      - name: Check if package was built
        id: check
        run: |
          if ls repo/*.xbps 1>/dev/null 2>&1; then
            echo "built=true" >> $GITHUB_OUTPUT
            PKG=$(ls repo/*.xbps 2>/dev/null | head -1)
            echo "pkg=$PKG" >> $GITHUB_OUTPUT
            echo "pkgname=$(basename $PKG)" >> $GITHUB_OUTPUT
          else
            echo "built=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        if: steps.check.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.check.outputs.pkgname }}
          path: ${{ steps.check.outputs.pkgname }}

      - name: Update repo index
        if: steps.check.outputs.built == 'true'
        run: |
          cd repo
          xbps-rindex -a *.xbps

      - name: Commit and push repo index
        if: steps.check.outputs.built == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update repo: ${{ steps.check.outputs.pkgname }}"
          file_pattern: 'repo/* current'

      - name: Create Release
        if: steps.check.outputs.built == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.pkgname }}
          files: ${{ steps.check.outputs.pkgname }}
          generate_release_notes: true
