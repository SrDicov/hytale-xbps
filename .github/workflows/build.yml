name: Build and Release

on:
  schedule:
    - cron: '0 0 * * *'     # Cada 24 horas (medianoche UTC)
  workflow_dispatch:         # Permite lanzarlo manualmente

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build in Void container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-glibc-full:latest \
            /usr/bin/sh -c '
              xbps-install -Suy xbps jq curl unzip coreutils bash openssl 2>&1 | tail -1
              /usr/bin/bash ./build.sh
              cd repo && xbps-rindex -a *.xbps && cd ..
            '

      - name: Fix permissions
        run: sudo chown -R $(id -u):$(id -g) repo/ current 2>/dev/null || true

      - name: Check if package was built
        id: check
        run: |
          if ls repo/*.xbps 1>/dev/null 2>&1; then
            echo "built=true" >> $GITHUB_OUTPUT
            PKG=$(ls repo/*.xbps 2>/dev/null | head -1)
            echo "pkg=$PKG" >> $GITHUB_OUTPUT
            echo "pkgname=$(basename $PKG)" >> $GITHUB_OUTPUT
          else
            echo "built=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push repo index
        if: steps.check.outputs.built == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo/ current
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update repo: ${{ steps.check.outputs.pkgname }}"
            git push
          fi

      - name: Create Release
        if: steps.check.outputs.built == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.pkgname }}
          files: repo/${{ steps.check.outputs.pkgname }}
          generate_release_notes: true
